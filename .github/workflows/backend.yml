name: Backend tests
on:
  push:
  pull_request:
# Cancel stale mock-only runs for the same event/ref; never use this policy on
# paid evaluation workflows whose accounting must survive interruption.
concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PROOFREAD_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
